# ============================================================================
# GitLab CI：自动构建与发布（GitLab 侧仅构建 Linux CLI + Windows；
# Android / macOS / iOS 的完整构建矩阵在 GitHub Actions，
# 见 .github/workflows/release.yml）
#
# 触发时机：
#   - 默认分支每次 push / 手动触发 → 构建全部产物并：
#     ① 上传 generic package registry 的 "continuous" 版本（同名覆盖）
#     ② 维护滚动 Release（tag 名固定为 continuous，指向最新提交，
#        Release 页始终可直接下载最新产物）
#   - 推送 v* 标签 → 正式 Release（版本化产物挂到 Release 页）
#
# 注意：workflow 的 tag 规则限定 ^v/ —— CI 自建的 continuous 标签
# 不会再触发 tag 流水线（否则无限循环且 Release 创建撞 409）。
#
# 自动构建矩阵（Linux Docker runner）：
#   build:linux-cli   Linux CLI（原生构建）
#   build:windows     Windows：Tauri NSIS 安装包 + CLI
#                     （cargo-xwin 交叉编译，tauri 官方 Linux→Windows 方案）
# ============================================================================

workflow:
  rules:
    # 手动触发（Run pipeline 按钮）
    - if: $CI_PIPELINE_SOURCE == "web"
    # 正式发版：v* 标签（continuous 等 CI 自建标签不在此列，避免循环触发）
    - if: '$CI_COMMIT_TAG =~ /^v/'
    # 默认分支每次 push：滚动构建 + 滚动 Release
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - build
  - publish

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  PKG_NAME: "mystery-novel-agent"
  WIN_TARGET: "x86_64-pc-windows-msvc"

# ---------------------------------------------------------------- CLI (Linux)
build:linux-cli:
  stage: build
  image: rust:1-bookworm
  interruptible: true
  timeout: 90m
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    key: cargo-registry-linux
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
  script:
    - cargo build --release --locked -p mystery-novel-agent
    - mkdir -p dist
    - cp target/release/mystery-novel-agent "dist/${PKG_NAME}-linux-amd64"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ------------------------------------------- GUI 安装包 + CLI (Linux 交叉编译)
build:windows:
  stage: build
  image: rust:1-bookworm
  interruptible: true
  timeout: 2h
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    key: cargo-xwin-cache
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
      - .cargo-home/bin/
      - .xwin-cache/
      - frontend/.npm/
  before_script:
    # 跨编译依赖：clang/llvm（cargo-xwin）、nsis（tauri 打包）、node（前端构建）
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends clang llvm nsis nodejs npm
    - export PATH="$CARGO_HOME/bin:$PATH" # cargo install 的二进制装在 $CARGO_HOME/bin
    - rustup target add "$WIN_TARGET"
    - command -v cargo-xwin >/dev/null || cargo install --locked cargo-xwin
    - command -v cargo-tauri >/dev/null || cargo install --locked tauri-cli --version "^2"
  script:
    # 前端依赖（tauri 的 beforeBuildCommand 只执行 npm run build，需先装好 node_modules）
    - cd frontend && npm ci --cache .npm --prefer-offline && cd ..
    # GUI：NSIS 安装包（tauri.conf.json 的 beforeBuildCommand 自动构建前端）
    - cargo tauri build --runner cargo-xwin --target "$WIN_TARGET" --bundles nsis
    # CLI：Windows 版可执行文件
    - cargo xwin build --release --locked -p mystery-novel-agent --target "$WIN_TARGET"
    - mkdir -p dist
    # 产物统一 ASCII 命名（避免非 ASCII 文件名进 API / 下载链接）
    - cp "target/${WIN_TARGET}/release/bundle/nsis/"*-setup.exe dist/mystery-shelf-windows-x64-setup.exe
    - cp "target/${WIN_TARGET}/release/mystery-novel-agent.exe" "dist/${PKG_NAME}-windows-x64.exe"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# --------------------- 滚动发布（默认分支 push → continuous 包 + 滚动 Release）
# Release 页固定保留一个 tag=continuous 的条目：每次构建先删旧 Release/tag
# 再以当前提交重建，资产链接指向包仓库 continuous 版本 —— 永远是最新构建。
publish:continuous:
  stage: publish
  image: curlimages/curl:latest
  needs:
    - job: build:linux-cli
      artifacts: true
    - job: build:windows
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -eu
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      # 1) 产物上传到包仓库 continuous 版本（同名覆盖），同时收集 Release 资产链接
      LINKS="["
      sep=""
      for f in dist/*; do
        base=$(basename "$f")
        url="${API}/packages/generic/${PKG_NAME}/continuous/${base}"
        echo "上传 ${base} → ${PKG_NAME}/continuous"
        curl --fail --retry 3 \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "$url"
        LINKS="${LINKS}${sep}{\"name\":\"${base}\",\"url\":\"${url}\"}"
        sep=","
      done
      LINKS="${LINKS}]"
      # 2) 滚动 Release：删旧 Release 与 tag（首次运行为 404，属正常），
      #    再以当前提交重建。若 tag 删除被权限拦截，退化为在旧 tag 上建
      #    Release —— 资产链接仍指向刚上传的最新产物，仅源码快照偏旧。
      echo "清理旧 continuous Release / tag…"
      curl -s -o /dev/null -w "  release DELETE: HTTP %{http_code}\n" -X DELETE \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/releases/continuous" || true
      curl -s -o /dev/null -w "  tag DELETE: HTTP %{http_code}\n" -X DELETE \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/repository/tags/continuous" || true
      echo "创建 continuous Release…"
      BODY="{\"tag_name\":\"continuous\",\"ref\":\"${CI_COMMIT_SHA}\",\"name\":\"Latest build (${CI_COMMIT_SHORT_SHA})\",\"description\":\"默认分支最新构建（每次 push 自动更新）。\\n\\n- Windows：mystery-shelf-windows-x64-setup.exe（NSIS 安装包）\\n- CLI：Linux / Windows\\n\\nAndroid / macOS / iOS 产物在 GitHub Releases；正式版本见 v* 标签的 Release。\",\"assets\":{\"links\":${LINKS}}}"
      code=$(curl -s -o /tmp/rel.json -w "%{http_code}" -X POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$BODY" \
        "${API}/releases")
      echo "  release POST: HTTP ${code}"
      cat /tmp/rel.json 2>/dev/null || true
      echo ""
      if [ "$code" != "201" ] && [ "$code" != "200" ]; then
        echo "警告：滚动 Release 创建失败（产物仍可从包仓库下载，见下行链接）"
      fi
      echo "Release 页：${CI_PROJECT_URL}/-/releases"
      echo "包仓库：${CI_PROJECT_URL}/-/packages?type=GENERIC"

# ----------------------------------------------- 正式发布（v* 标签 → Release）
publish:release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux-cli
      artifacts: true
    - job: build:windows
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      set -eu
      ASSET_ARGS=""
      for f in dist/*; do
        base=$(basename "$f")
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_NAME}/${CI_COMMIT_TAG}/${base}"
        echo "上传 ${base} → ${PKG_NAME}/${CI_COMMIT_TAG}"
        curl --fail --retry 3 \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "$url"
        ASSET_ARGS="$ASSET_ARGS --assets-link {\"name\":\"${base}\",\"url\":\"${url}\"}"
      done
      # shellcheck disable=SC2086  # 产物文件名均为 ASCII 且无空格，故意分词展开
      release-cli create \
        --name "Release ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "标签 ${CI_COMMIT_TAG} 的自动构建产物：Windows 安装包（NSIS）+ Linux / Windows CLI。Android / macOS / iOS 产物见 GitHub Releases。" \
        $ASSET_ARGS