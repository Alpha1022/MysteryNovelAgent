# ============================================================================
# GitHub Actions：全平台自动构建与发布
#
# 推送方式（本地分支 master → GitHub main）：
#   git push github master:main        # 滚动构建 + 维护 continuous 预发布
#   git push github v0.1.0             # 正式 Release（需先在本地打 tag）
#
# 触发时机：
#   - push 到 main / 手动触发 → 构建五平台产物：
#     ① 上传 workflow artifacts（90 天）
#     ② 维护滚动预发布 Release（tag 固定为 continuous，指向最新提交）
#   - 推送 v* 标签 → 正式 Release（全部产物挂到该版本）
#
# 构建矩阵（GitHub 托管 runner，原生环境无需交叉编译）：
#   build-windows    windows-latest：Tauri NSIS 安装包 + Windows CLI
#   build-linux      ubuntu-24.04：deb + AppImage + Linux CLI
#   build-android    ubuntu-latest：aarch64 + armv7 通用 APK（签名见下）
#   build-macos      macos-latest（arm64）：universal DMG + universal CLI
#   build-ios        macos-latest：iOS Rust 编译检查（设备+模拟器双目标；
#                    tauri 的 Xcode 工程须由 CLI 服务进程编排，直接
#                    xcodebuild 不可行；无签名分发物，真机需开发者证书）
#
# Android 签名（gen/android 的 gradle 读环境变量 KEYSTORE_FILE /
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD；CI 侧由 Secrets 提供）：
#   仓库 Settings → Secrets and variables → Actions → Secrets 配置：
#     KEYSTORE_BASE64      keystore 文件内容（base64；CI 解码后作为 KEYSTORE_FILE）
#     KEYSTORE_PASSWORD    keystore 口令
#     KEY_ALIAS            别名
#     KEY_PASSWORD         私钥口令
#   四项为必需 —— 缺失时构建前快速报错（keytool 预检口令与别名，
#   避免全量编译后签名环节才失败）。
#
# 注意：私有仓库消耗 Actions 配额（macOS runner 按 10 倍计费），
#   公开仓库免费；流水线并发做了去重（同分支新推送自动取消旧构建）。
# ============================================================================

name: build-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 发布 Release / 创建 continuous tag

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '5'
  RUST_BACKTRACE: '1'
  ANDROID_NDK_VERSION: 26.3.11579264

jobs:
  # ------------------------------------------------------------ Windows
  build-windows:
    name: Windows（NSIS + CLI）
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 预编译安装 tauri-cli（失败则回退源码编译）
      - name: 安装 tauri-cli（预编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tauri
        continue-on-error: true
      - name: 安装 tauri-cli（源码兜底）
        shell: bash
        run: command -v cargo-tauri >/dev/null 2>&1 || cargo install --locked tauri-cli --version "^2"
      - name: 前端依赖
        run: npm ci
        working-directory: frontend
      - name: 构建 GUI（NSIS 安装包）
        run: cargo tauri build --bundles nsis
      - name: 构建 CLI
        run: cargo build --release --locked -p mystery-novel-agent
      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/bundle/nsis/*-setup.exe dist/mystery-shelf-windows-x64-setup.exe
          cp target/release/mystery-novel-agent.exe dist/mystery-novel-agent-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- Linux
  build-linux:
    name: Linux（deb/AppImage + CLI）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # AppImage 打包工具（linuxdeploy）无 FUSE 也能跑
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: 安装系统依赖（webkit2gtk-4.1 为 Tauri v2 所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
          # 24.04 的 fuse2 包名迁移到 libfuse2t64；两者都装不上也不致命
          # （已设 APPIMAGE_EXTRACT_AND_RUN）
          sudo apt-get install -y libfuse2 2>/dev/null \
            || sudo apt-get install -y libfuse2t64 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装 tauri-cli（预编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tauri
        continue-on-error: true
      - name: 安装 tauri-cli（源码兜底）
        run: command -v cargo-tauri >/dev/null 2>&1 || cargo install --locked tauri-cli --version "^2"
      - name: 前端依赖
        run: npm ci
        working-directory: frontend
      - name: 构建 GUI（deb + AppImage）
        run: cargo tauri build --bundles deb,appimage
      - name: 构建 CLI
        run: cargo build --release --locked -p mystery-novel-agent
      - name: 收集产物
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb dist/mystery-shelf-linux-amd64.deb
          cp target/release/bundle/appimage/*.AppImage dist/mystery-shelf-linux-amd64.AppImage
          cp target/release/mystery-novel-agent dist/mystery-novel-agent-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------ Android
  build-android:
    name: Android（arm64+armv7 APK）
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 安装 tauri-cli（预编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tauri
        continue-on-error: true
      - name: 安装 tauri-cli（源码兜底）
        run: command -v cargo-tauri >/dev/null 2>&1 || cargo install --locked tauri-cli --version "^2"
      # GitHub runner 自带 Android SDK（ANDROID_HOME 已设置），补装本项目
      # 所需组件：compileSdk 36 / build-tools / NDK（gradle 8.14 + AGP 8.11）
      - name: 安装 Android SDK 组件与 NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
      # 签名：解码 KEYSTORE_BASE64 → keystore 文件并预检（口令/别名正确性），
      # 缺 Secrets 或密钥无效时快速失败 —— 不等全量 Rust 编译后才在签名环节报错
      - name: 准备签名密钥
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_KEY_PASS" ]; then
            echo "::error::缺少 Android 签名 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），请在 Settings → Secrets and variables → Actions 配置"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > /tmp/upload.keystore
          keytool -list -keystore /tmp/upload.keystore -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null
          echo "KEYSTORE_FILE=/tmp/upload.keystore" >> "$GITHUB_ENV"
          echo "签名密钥就绪（alias=$KS_ALIAS）"
      - name: 前端依赖
        run: npm ci
        working-directory: frontend
      - name: 构建 APK
        env:
          # gradle 经环境变量读取签名四项（KEYSTORE_FILE 已入 GITHUB_ENV）
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cargo tauri android build --apk --target aarch64 --target armv7
      - name: 收集产物
        run: |
          set -eu
          mkdir -p dist
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" -type f | head -n1)
          if [ -z "$APK" ]; then echo "未找到构建产物 APK"; exit 1; fi
          cp "$APK" dist/mystery-shelf-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- macOS
  build-macos:
    name: macOS（universal DMG + CLI）
    runs-on: macos-latest # arm64；产物为 universal（同时含 arm64 + x86_64）
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin 不是 rustc 目标：tauri CLI 分别构建两架构后 lipo 合并
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装 tauri-cli（预编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tauri
        continue-on-error: true
      - name: 安装 tauri-cli（源码兜底）
        run: command -v cargo-tauri >/dev/null 2>&1 || cargo install --locked tauri-cli --version "^2"
      - name: 前端依赖
        run: npm ci
        working-directory: frontend
      - name: 构建 GUI（universal DMG）
        run: cargo tauri build --target universal-apple-darwin --bundles dmg
      - name: 构建 CLI（两架构 + lipo 合并为 universal）
        run: |
          cargo build --release --locked -p mystery-novel-agent --target aarch64-apple-darwin
          cargo build --release --locked -p mystery-novel-agent --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/mystery-novel-agent-macos-universal \
            target/aarch64-apple-darwin/release/mystery-novel-agent \
            target/x86_64-apple-darwin/release/mystery-novel-agent
      - name: 收集产物
        run: cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/mystery-shelf-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- iOS
  # 说明：tauri 生成的 Xcode 工程的「Build Rust Code」阶段必须由
  # `tauri ios build/dev` 的服务进程编排（经临时目录 {identifier}-server-addr
  # 文件通信）——绕过 CLI 直接 xcodebuild 会在 read_options 处 panic；
  # 而 `tauri ios build` 面向真机归档且需要签名，CLI 不支持模拟器目标。
  # 因此本 job 退为 Rust 侧编译检查（设备 + 模拟器双目标，即该 script
  # 阶段内部执行的 cargo build），不产出可分发物 —— 真机安装需 Apple
  # 开发者证书，经 Xcode 打开 gen/apple 归档签名。
  build-ios:
    name: iOS（Rust 编译检查）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # generate_context! 宏在编译期嵌入 frontend/dist（目录必须存在）
      - name: 前端构建（编译期依赖）
        run: npm ci && npm run build
        working-directory: frontend
      - name: 编译 Rust（设备 + 模拟器双目标）
        run: cargo build --release -p mystery-gui --target aarch64-apple-ios --target aarch64-apple-ios-sim

  # -------------------------------------------------------------- 发布
  publish:
    name: 发布
    needs: [build-windows, build-linux, build-android, build-macos, build-ios]
    if: >-
      startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "本次产物："; ls -la dist/
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 正式版本 Release
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Release ${GITHUB_REF_NAME}" \
              --notes "标签 ${GITHUB_REF_NAME} 的自动构建产物：
          - Windows：mystery-shelf-windows-x64-setup.exe（NSIS 安装包）
          - Linux：deb / AppImage / CLI
          - Android：universal APK（arm64 + armv7）
          - macOS：universal DMG / CLI
          - iOS：仅做 Rust 编译检查（真机分发需 Apple 开发者证书签名）"
          else
            # 滚动预发布：删旧 Release 与 tag 后以当前提交重建（首次运行为空，属正常）
            gh release delete continuous --yes --cleanup-tag 2>/dev/null || true
            gh release create continuous dist/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Latest build (${GITHUB_SHA::7})" \
              --notes "main 分支最新构建（每次 push 自动更新）。

          - Windows：mystery-shelf-windows-x64-setup.exe（NSIS 安装包）
          - Linux：deb / AppImage / CLI
          - Android：universal APK（arm64 + armv7）
          - macOS：universal DMG / CLI
          - iOS：仅做 Rust 编译检查（真机分发需 Apple 开发者证书签名）

          正式版本见 v* 标签的 Release。"
          fi
